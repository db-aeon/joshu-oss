# Joshu per-customer VPS stack. Requires prebuilt images: see deploy/README.md
# On a box, the release writes this file (host bundle, deploy/scripts/install-host-bundle.sh).
# Usage:
#   Standalone (no control plane): docker compose -f deploy/docker-compose.yml up -d
# Fleet (+ instance agent):       docker compose -f deploy/docker-compose.yml --profile fleet up -d

# Fixed project name: the data volumes are deploy_joshu_* and deploy_caddy_*.
name: deploy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    # Self-healing edge: caddy-entrypoint.sh renders /etc/caddy/Caddyfile from
    # /etc/joshu/instance.env on every start, so git operations on the clone can
    # never leave Caddy serving a stale/empty config.
    entrypoint: ["/bin/sh", "/usr/local/bin/caddy-entrypoint.sh"]
    volumes:
      - ./scripts/render-caddyfile.sh:/usr/local/bin/render-caddyfile.sh:ro
      - ./scripts/caddy-entrypoint.sh:/usr/local/bin/caddy-entrypoint.sh:ro
      # Directory bind (not the file) so host `sed -i` / rewrite of instance.env
      # stays visible inside the container. A file bind keeps the old inode.
      - /etc/joshu:/etc/joshu:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CUSTOMER_DOMAIN: ${CUSTOMER_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
    depends_on:
      joshu-stack:
        condition: service_started

  joshu-stack:
    image: ${JOSHU_IMAGE_REF:-ghcr.io/your-org/joshu-oss:latest}
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${JOSHU_COMPOSE_ENV_FILE:-./.env.vps.example}
    # hotfix vps-start > .image (0.1.44+) > baked /opt/joshu/scripts (0.1.43 seed).
    command:
      - bash
      - -c
      - |
        if [ -f /opt/joshu/hotfix/scripts/vps-start.sh ]; then
          exec bash /opt/joshu/hotfix/scripts/vps-start.sh
        elif [ -f /opt/joshu/.image/scripts/vps-start.sh ]; then
          exec bash /opt/joshu/.image/scripts/vps-start.sh
        else
          exec bash /opt/joshu/scripts/vps-start.sh
        fi
    volumes:
      # The image is the only source of code (change image-owned-box-runtime).
      # Do not mount host code at or below /opt/joshu. A fix of code or content
      # needs a new release image. The one exception is the hotfix overlay:
      # files in hotfix/scripts replace image scripts at boot (empty dir is safe).
      - ../hotfix/scripts:/opt/joshu/hotfix/scripts:ro
      # Product skills are seeded to $HERMES_HOME/skills/joshu/ (writable learning loop).
      # Directory bind so host rewrites of instance.env are visible without recreate.
      - /etc/joshu:/etc/joshu:ro
      - joshu_arozos:/var/lib/arozos
      - joshu_hermes:/root/.hermes
      - joshu_hindsight_home:/home/hindsight/.hindsight
      - joshu_hindsight_cache:/home/hindsight/.cache/huggingface
      - joshu_postgres:/var/lib/postgresql/hindsight
      - joshu_gbrain:/root/.gbrain
    # The first start of a release can run the skills seed with LLM merges before the Joshu
    # API starts (several minutes). The start period covers the skills seed, so compose does
    # not mark the stack unhealthy and stop instance-agent (depends_on service_healthy).
    # The stack becomes healthy at the first good check, also within the start period.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/joshu/api/instance/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

  instance-agent:
    # Agent image of the release (JOSHU_INSTANCE_AGENT_IMAGE_REF). build: is for standalone use.
    image: ${JOSHU_INSTANCE_AGENT_IMAGE_REF:-ghcr.io/your-org/joshu-oss-instance-agent:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.instance-agent
    command: ["node", "/app/dist/index.js"]
    restart: unless-stopped
    network_mode: host
    profiles:
      - fleet
    env_file:
      - ${JOSHU_COMPOSE_ENV_FILE:-./.env.vps.example}
    volumes:
      # Host paths must match inside the container — agent runs docker compose via the host socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR creds live on the host (~/.docker/config.json); without this mount, compose pull is anonymous → 401.
      - /root/.docker:/root/.docker:ro
      # Directory bind: host `sed -i` of instance.env must not leave the agent
      # writing Twilio rotates onto a stale inode while SSH sees a different file.
      - /etc/joshu:/etc/joshu
      # Host bundle, hotfix overlay, and backups. The agent writes the host bundle
      # on a release update and reports runtime drift. It runs no code from here.
      - /opt/joshu:/opt/joshu
    depends_on:
      joshu-stack:
        condition: service_healthy


  voice-realtime:
    image: ${JOSHU_VOICE_IMAGE_REF:-ghcr.io/your-org/joshu-oss-voice-realtime:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.voice-realtime
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${JOSHU_COMPOSE_ENV_FILE:-./.env.vps.example}
    volumes:
      # Share Aroz user data so resolveJoshuIdentity() reads .joshu/identity.json (voiceId).
      - joshu_arozos:/var/lib/arozos:ro
      # Writable home for derived voice assets (pre-rendered passphrase-lock clips).
      - joshu_voice_clips:/var/lib/joshu-voice
    profiles:
      - voice-rt

volumes:
  caddy_data:
  caddy_config:
  joshu_arozos:
  joshu_hermes:
  joshu_hindsight_home:
  joshu_hindsight_cache:
  joshu_postgres:
  joshu_gbrain:
  joshu_voice_clips:
